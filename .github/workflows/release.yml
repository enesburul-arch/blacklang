name: Release

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.22"

      - name: Build Linux binary
        working-directory: packages/cli
        run: GOOS=linux GOARCH=amd64 go build -o ../../dist/black-linux-x64 ./cmd/black

      - name: Build Windows binary
        working-directory: packages/cli
        run: GOOS=windows GOARCH=amd64 go build -o ../../dist/black-windows-x64.exe ./cmd/black

      - name: Build macOS Intel binary
        working-directory: packages/cli
        run: GOOS=darwin GOARCH=amd64 go build -o ../../dist/black-darwin-x64 ./cmd/black

      - name: Build macOS Apple Silicon binary
        working-directory: packages/cli
        run: GOOS=darwin GOARCH=arm64 go build -o ../../dist/black-darwin-arm64 ./cmd/black

      - uses: actions/upload-artifact@v4
        with:
          name: blacklang-binaries
          path: dist/
